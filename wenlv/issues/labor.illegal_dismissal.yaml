# 请求权基础：劳动者请求用人单位支付违法解除劳动合同赔偿金
#
# 条号与锚点词均取自 flk.npc.gov.cn 官方正文（tools/probe.py 实测），
# 不凭记忆填写。

id: labor.illegal_dismissal
claim: 劳动者请求用人单位支付违法解除劳动合同赔偿金

keywords: [辞退, 开除, 解雇, 被炒, 违法解除, 劳动合同, 赔偿金, 经济补偿, 劳动仲裁, 单位不要我了]

limitation:
  years: 1
  fact: limitation
  start_prompt: 一年从哪一天起算？（从你知道或者应当知道自己被辞退那天算）
  note: 劳动仲裁时效只有一年，比普通民事的三年短得多，而且要先仲裁才能起诉，时间比想象中紧。

actions:
  - 先把能证明劳动关系的材料凑齐：劳动合同、工资流水、考勤记录、工牌、工作群聊天记录。
  - 书面要求单位出具解除通知或辞退证明；口头辞退的，立刻补一条微信文字确认（"今天你说让我不用来了，是这个意思吗"）。
  - 去单位所在地或劳动合同履行地的劳动人事争议仲裁委员会申请仲裁——这一步不能跳过，直接去法院会被不予受理。

lawyer:
  - when: 仲裁时效可能已经过了（一年），请求会被驳回
    fact: limitation
    status: confirmed
  - when: 单位以严重违纪为由辞退，需要判断规章制度是否有效、是否经过民主程序
    fact: illegality
    status: confirmed

elements:
  - key: relation
    question: 你和这家单位签过劳动合同吗？没签的话，有没有工资流水、工牌、考勤、工作群记录能证明你在那里上过班？
    why: 劳动关系是全部请求的前提；没有书面合同，就要靠事实劳动关系来证明，举证重点完全不同。
    basis:
      - ref: 劳动合同法第10条
        anchor: 建立劳动关系，应当订立书面劳动合同
      - ref: 劳动合同法第7条
        anchor: 自用工之日起即与劳动者建立劳动关系
    probe:
      - 工资是谁发给你的？对公账户、老板个人账户还是微信转账？
      - 有没有打卡记录、排班表、工牌、工作群聊天记录？
      - 单位有没有给你交社保？
    evidence:
      - 劳动合同（如有）
      - 工资流水或工资条
      - 考勤记录、排班表、工牌照片
      - 工作群聊天记录、工作邮件
      - 社保缴费记录

  - key: dismissal
    question: 单位是什么时候、以什么方式让你走的？是口头通知、书面通知，还是直接不让你进门？
    why: 必须先确定"解除"这个事实本身。没有解除，就没有赔偿金；口头辞退要有证据，否则单位可能改口说是你自己辞职。
    basis:
      - ref: 劳动合同法第48条
        anchor: 用人单位违反本法规定解除或者终止劳动合同
    probe:
      - 有没有书面的解除通知、辞退证明？
      - 口头辞退时有谁在场？有没有录音、微信记录？
      - 单位后来有没有让你签"自愿离职"或者"协商解除"的文件？
    evidence:
      - 解除劳动合同通知书、辞退证明
      - 微信、短信、通话录音等口头辞退的证明
      - 门禁被停、工位被收的现场照片或证人

  - key: illegality
    question: 单位当时给的理由是什么？有没有提前通知你，有没有通知工会，有没有走任何书面程序？
    why: 违法解除是赔偿金（二倍）和普通经济补偿的分水岭。单位要么能证明你符合法定解除情形，要么就是违法解除。
    basis:
      - ref: 劳动合同法第48条
        anchor: 用人单位违反本法规定解除或者终止劳动合同
      - ref: 劳动合同法第43条
        anchor: 事先将理由通知工会
    probe:
      - 单位说你违反了哪条规章制度？那份制度你签收过吗？
      - 有没有给你书面警告、处罚决定？
      - 你是不是在试用期、孕期、哺乳期或者医疗期？
    evidence:
      - 单位给出的解除理由（书面或录音）
      - 单位的规章制度及你签收的记录
      - 处分决定、警告书
      - 孕检、病历等特殊保护期间的证明

  - key: base
    question: 你在这家单位干了多久？离职前十二个月平均每月拿多少钱（含奖金、补贴）？
    why: 赔偿金按工作年限折算月工资，再乘二。年限和工资基数算错，请求金额就不对。
    basis:
      - ref: 劳动合同法第47条
        anchor: 经济补偿按劳动者在本单位工作的年限
      - ref: 劳动合同法第87条
        anchor: 经济补偿标准的二倍
    probe:
      - 中间有没有断过、换过关联公司签合同？
      - 工资是发现金还是打卡？有没有工资条、银行流水？
      - 你的月工资有没有超过当地上年度职工月平均工资的三倍？
    evidence:
      - 离职前十二个月的工资流水
      - 劳动合同起止日期、历次续签记录
      - 奖金、补贴的发放记录
      - 当地上年度职工月平均工资标准（人社局公布）

  - key: limitation
    question: 从你被辞退那天到今天，超过一年了吗？中间有没有申请过仲裁、投诉过、或者单位答应过赔偿？
    why: 劳动争议申请仲裁的时效期间为一年，超过且无中断事由，请求会被驳回。
    essential: false
    basis:
      - ref: 劳动争议调解仲裁法第27条
        anchor: 仲裁时效期间为一年
    probe:
      - 最近一次和单位谈赔偿是哪一年哪一月？
      - 有没有向劳动监察投诉过？有没有书面记录？
    evidence:
      - 与单位协商赔偿的记录及日期
      - 向劳动监察投诉的材料
      - 之前申请仲裁的材料

  - key: procedure
    question: 你已经申请劳动仲裁了吗？还是打算直接去法院起诉？
    why: 劳动争议仲裁前置，不经仲裁直接起诉法院不予受理，白跑一趟还可能拖过时效。
    essential: false
    basis:
      - ref: 劳动争议调解仲裁法第5条
        anchor: 可以向劳动争议仲裁委员会申请仲裁
    probe:
      - 有没有拿到仲裁裁决书？对结果服不服？
      - 仲裁申请有没有被不予受理或者按撤回处理？
    evidence:
      - 仲裁申请书、受理通知书
      - 仲裁裁决书
      - 不予受理通知书（如有）
