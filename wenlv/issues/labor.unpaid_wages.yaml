# 请求权基础：劳动者请求支付拖欠的工资及加班费
#
# 条号与锚点词均取自 flk.npc.gov.cn 官方正文（tools/probe.py 实测），
# 不凭记忆填写。

id: labor.unpaid_wages
claim: 劳动者请求支付拖欠的工资及加班费

keywords: [欠薪, 拖欠工资, 不发工资, 克扣工资, 加班费, 工资没给, 老板不给钱, 劳动报酬, 离职不发工资]

limitation:
  years: 1
  fact: limitation
  start_prompt: 一年从哪一天起算？（劳动关系已终止的，从终止之日起算；还在职的不受这一年限制）
  note: 劳动关系存续期间因拖欠劳动报酬发生争议，不受一年仲裁时效限制；劳动关系终止的，从终止之日起一年内提出。这一条和普通劳动纠纷不一样，别搞混。

actions:
  - 先把工资构成算清楚：基本工资、绩效、补贴各多少，欠了哪几个月，加班多少小时、按什么标准算。
  - 保留工资条、银行流水、考勤记录、排班表；用微信发过工资的，把转账记录和聊天一起存好。
  - 向单位所在地或劳动合同履行地的劳动人事争议仲裁委员会申请仲裁，欠薪案件仲裁不收费。

lawyer:
  - when: 时效可能已经过了，请求会被驳回
    fact: limitation
    status: confirmed
  - when: 涉及加班费，需要核算工时和计算标准，金额可能不小
    fact: overtime
    status: confirmed

elements:
  - key: relation
    question: 你在这家单位做什么工作？从什么时候开始做的？签劳动合同了吗？
    why: 劳动关系是主张劳动报酬的前提。没签合同就要靠工资流水、考勤、工牌等证明事实劳动关系。
    basis:
      - ref: 劳动合同法第10条
        anchor: 建立劳动关系，应当订立书面劳动合同
    probe:
      - 工资是谁发给你的？公司账户、老板个人账户还是微信？
      - 有没有工牌、考勤、工作群记录？
    evidence:
      - 劳动合同（如有）
      - 工资流水或工资条
      - 考勤记录、排班表、工牌照片
      - 社保缴费记录

  - key: wages
    question: 单位欠你哪几个月的工资？每个月应发多少、实发多少？
    why: 请求金额必须逐月能算清。说不清哪个月欠多少，仲裁委无法支持具体数额。
    basis:
      - ref: 劳动合同法第30条
        anchor: 用人单位应当按照劳动合同约定和国家规定，向劳动者及时足额支付劳动报酬
      - ref: 劳动法第50条
        anchor: 工资应当以货币形式按月支付给劳动者本人
    probe:
      - 约定的工资是多少？有没有书面的工资标准？
      - 是整月没发，还是只发了一部分？
    evidence:
      - 劳动合同或录用通知上的工资标准
      - 历月工资条、银行流水
      - 与负责人确认欠薪的聊天记录

  - key: overtime
    question: 有没有加班？平时加班、周末加班、法定节假日加班各多少小时？单位有审批吗？
    why: 三种加班费率不同（150%、200%、300%），分开算才不吃亏；没有审批记录，要靠考勤和聊天证明是单位安排的。
    essential: false
    basis:
      - ref: 劳动法第44条
        anchor: 用人单位应当按照下列标准支付高于劳动者正常工作时间工资的工资报酬
    probe:
      - 加班是单位要求的还是自愿留下的？有没有排班表、加班通知？
      - 打卡记录能不能导出？有没有工作群里的加班安排？
    evidence:
      - 考勤记录、打卡截图
      - 加班通知、排班表
      - 工作群里安排加班的聊天记录

  - key: payment
    question: 单位对你讨薪是什么态度？有没有承诺过什么时候发，或者发过一部分？
    why: 单位承认欠薪、承诺发放，既是证据也是时效中断的事由。
    essential: false
    basis:
      - ref: 劳动合同法第85条
        anchor: 由劳动行政部门责令限期支付劳动报酬、加班费或者经济补偿
    probe:
      - 有没有书面的欠薪确认、还款承诺？
      - 投诉过劳动监察吗？处理结果是什么？
    evidence:
      - 欠薪确认书、还款承诺
      - 与负责人沟通的聊天记录、录音
      - 劳动监察投诉材料及处理结果

  - key: limitation
    question: 你现在还在职吗？如果已经离职，是哪一天离开的？
    why: 在职期间讨薪不受一年仲裁时效限制；一旦离职，就要从离职之日起一年内提出，这一条和普通劳动纠纷差别很大。
    essential: false
    basis:
      - ref: 劳动争议调解仲裁法第27条
        anchor: 仲裁时效期间为一年
    probe:
      - 离职时有没有办手续、签过什么文件？
      - 离职后有没有再向单位主张过工资？
    evidence:
      - 离职证明、解除劳动合同通知书
      - 离职后主张工资的记录

  - key: procedure
    question: 你申请劳动仲裁了吗？还是打算直接去法院？
    why: 劳动争议仲裁前置，不经仲裁直接起诉法院不予受理。
    essential: false
    basis:
      - ref: 劳动争议调解仲裁法第5条
        anchor: 可以向劳动争议仲裁委员会申请仲裁
    probe:
      - 有没有拿到仲裁裁决书？对结果服不服？
    evidence:
      - 仲裁申请书、受理通知书
      - 仲裁裁决书
