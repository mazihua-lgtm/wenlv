# 请求权基础：子女请求父母支付抚养费
#
# 条号与锚点词均取自 flk.npc.gov.cn 官方正文（tools/probe.py 实测），
# 不凭记忆填写。

id: family.child_support
claim: 子女请求父母支付抚养费

keywords: [抚养费, 孩子抚养费, 不给抚养费, 离婚孩子, 抚养, 生活费, 前夫不给钱, 前妻不给钱]

limitation:
  years: 3
  fact: limitation
  start_prompt: 三年从哪一天起算？（从对方开始不付抚养费那天；如果是离婚协议或判决确定的，从每期应付款的到期日）
  note: 请求支付抚养费一般不受诉讼时效限制，但已经到期未付的部分，实务中常按三年处理，具体要看当地法院做法。

actions:
  - 先算清楚：孩子每月实际支出多少，对方收入多少，按什么比例主张（有固定收入的一般是月收入的 20%–30%）。
  - 保留孩子的支出凭证：学费、医疗费、生活费的票据，以及对方未支付的记录。
  - 已经有离婚协议或判决的，直接申请强制执行比重新起诉快；没有约定的，先起诉确定抚养费标准。

lawyer:
  - when: 对方长期不付，累计金额较大，需要一并主张并考虑强制执行
    fact: nonpayment
    status: confirmed
  - when: 对方收入不固定或者故意隐瞒收入，抚养费基数难以确定
    fact: amount
    status: confirmed

elements:
  - key: relation
    question: 孩子和对方是什么关系？是婚生子女、非婚生子女，还是形成了抚养关系的继子女、养子女？
    why: 抚养义务的来源不同，举证方式不同。非婚生子女需要先证明亲子关系，继子女要看是否形成抚养关系。
    basis:
      - ref: 民法典第1067条
        anchor: 有要求父母给付抚养费的权利
    probe:
      - 有没有出生医学证明？上面写的是谁？
      - 对方有没有否认过亲子关系？
    evidence:
      - 出生医学证明
      - 户口本
      - 亲子鉴定意见（如有争议）

  - key: nonpayment
    question: 对方从什么时候开始不给或少给？之前给多少，现在给多少？
    why: 欠付的起算时间决定能主张多少钱，也影响时效怎么算。
    basis:
      - ref: 民法典第1067条
        anchor: 有要求父母给付抚养费的权利
    probe:
      - 之前是怎么给的？转账、现金还是微信？
      - 有没有催过？对方怎么回的？
    evidence:
      - 历次支付记录（转账流水、微信记录）
      - 催要抚养费的聊天记录及日期
      - 对方拒付的明确表示（聊天、录音）

  - key: amount
    question: 对方每月收入多少？在哪里工作？孩子每月实际花多少？
    why: 抚养费标准一般按月收入的 20%–30% 确定，无固定收入的按当地同行业平均或人均消费支出计算。收入说不清，数额就定不下来。
    basis:
      - ref: 民法典第1085条
        anchor: 另一方应当负担部分或者全部抚养费
    probe:
      - 对方是上班、做生意还是打零工？有没有固定工资流水？
      - 孩子有没有特殊支出：看病、特殊教育、康复训练？
    evidence:
      - 对方的收入证明、工资流水、社保缴纳记录
      - 孩子的学费、医疗费票据
      - 当地人均消费支出标准

  - key: agreement
    question: 之前有没有离婚协议、法院判决或者调解书约定过抚养费？
    why: 已有生效文书确定的，可以直接申请强制执行，不用重新起诉，省时省钱。
    essential: false
    basis:
      - ref: 民法典第1085条
        anchor: 另一方应当负担部分或者全部抚养费
    probe:
      - 协议或判决写的每月多少？从什么时候开始？
      - 对方履行了多久？从哪一期开始没付？
    evidence:
      - 离婚协议书
      - 法院判决书、调解书
      - 履行记录（转账流水）

  - key: limitation
    question: 对方欠付抚养费多久了？中间有没有书面催过？
    why: 抚养费请求权一般不适用诉讼时效，但已到期未付的部分各地做法不一，拖太久可能只能主张近三年的。
    essential: false
    basis:
      - ref: 民法典第188条
        anchor: 诉讼时效期间为三年
    probe:
      - 最早一笔没付的是什么时候？
      - 中间有没有发过律师函、起诉过？
    evidence:
      - 欠付起算时间的记录
      - 催告的书面材料
