# 请求权基础：继承人请求分割遗产
#
# 条号与锚点词均取自 flk.npc.gov.cn 官方正文（tools/probe.py 实测），
# 不凭记忆填写。

id: inheritance.division
claim: 继承人请求分割遗产

keywords: [遗产, 继承, 分家产, 父母去世, 遗嘱, 继承权, 房子继承, 兄弟争产, 法定继承]

limitation:
  years: 3
  fact: limitation
  start_prompt: 三年从哪一天起算？（从你知道或者应当知道自己的继承权被侵害那天）
  note: 继承开始后超过二十年再主张的，法院不再保护；三年从知道权利被侵害时起算。

actions:
  - 先把遗产清点出来：房产、存款、车辆、股权、债权，逐项写清登记在谁名下、现在谁在用。
  - 查清继承人范围：配偶、子女、父母、兄弟姐妹、祖父母外祖父母，以及有没有人先于被继承人死亡（涉及代位继承）。
  - 遗产被某一方独占的，尽快书面主张分割；担心转移的，起诉时申请财产保全。

lawyer:
  - when: 遗产被一方独占、有转移迹象，需要尽快保全
    fact: occupation
    status: confirmed
  - when: 存在遗嘱，需要对遗嘱效力和真伪做判断
    fact: will
    status: confirmed

elements:
  - key: death
    question: 被继承人是什么时候去世的？在哪里去世的？
    why: 继承从被继承人死亡时开始，这个时间点决定了适用哪部法律、时效从何时起算。
    basis:
      - ref: 民法典第1122条
        anchor: 不得继承的遗产
    probe:
      - 有没有死亡证明、火化证明？
      - 有没有被宣告死亡的情形？
    evidence:
      - 死亡证明、户籍注销证明
      - 火化证明

  - key: heirs
    question: 除了你，还有哪些继承人？父母、配偶、子女分别是谁，有没有人已经去世？
    why: 继承顺序和人数直接决定份额。漏掉一个继承人，分割方案就无效；有人先死亡的，可能涉及代位继承。
    basis:
      - ref: 民法典第1127条
        anchor: 遗产按照下列顺序继承
    probe:
      - 被继承人的父母还在吗？配偶呢？
      - 有没有子女先于被继承人去世？他们的孩子还在吗？
      - 有没有形成抚养关系的继子女、养子女？
    evidence:
      - 户口本、亲属关系证明
      - 结婚证、出生医学证明
      - 收养登记、继子女抚养关系的证明

  - key: estate
    question: 留下了哪些财产？房子、存款、车、公司股份、别人欠他的钱，各自在哪、登记在谁名下？
    why: 遗产范围不清，分割无从谈起；有些财产登记在别人名下，需要先确权。
    basis:
      - ref: 民法典第1122条
        anchor: 不得继承的遗产
    probe:
      - 有没有房产证、存折、银行卡、股权证明？
      - 有没有夫妻共同财产需要先析产？
      - 有没有人身保险金、抚恤金（这些不一定算遗产）？
    evidence:
      - 房产证、购房合同
      - 银行账户明细、存单
      - 车辆登记证
      - 公司工商登记、股权证明

  - key: will
    question: 有没有遗嘱？什么形式（自书、代书、打印、录音、公证）？有没有见证人？
    why: 有效遗嘱优先于法定继承。不同形式的遗嘱要求不同，形式不合法整份可能无效。
    essential: false
    basis:
      - ref: 民法典第1130条
        anchor: 同一顺序继承人继承遗产的份额，一般应当均等
    probe:
      - 遗嘱原件在谁手上？有没有公证？
      - 立遗嘱时被继承人神志清楚吗？有没有人陪同？
    evidence:
      - 遗嘱原件及复印件
      - 公证书
      - 见证人信息
      - 立遗嘱时的录音录像

  - key: occupation
    question: 遗产现在由谁占着、谁在用？有没有人已经把房子过户、把钱取走？
    why: 有人独占或转移遗产的，分割时可能少分；发现得早可以申请保全，晚了追不回来。
    essential: false
    basis:
      - ref: 民法典第1130条
        anchor: 同一顺序继承人继承遗产的份额，一般应当均等
    probe:
      - 房子现在谁住？租金谁收？
      - 存款有没有被取走？什么时候取的？
    evidence:
      - 房屋实际占用的照片、水电缴费记录
      - 银行取款记录
      - 房产过户登记信息

  - key: limitation
    question: 从你知道遗产被独占或者自己没分到，到现在超过三年了吗？
    why: 继承纠纷诉讼时效三年，从知道或应当知道权利被侵害起算；超过二十年的，法院不再保护。
    essential: false
    basis:
      - ref: 民法典第188条
        anchor: 诉讼时效期间为三年
    probe:
      - 你是什么时候发现遗产被处理的？
      - 中间有没有要求过分家产？
    evidence:
      - 发现遗产被处理的记录及日期
      - 要求分割的书面材料、聊天记录
