# 请求权基础：消费者请求退还价款并主张三倍赔偿
#
# 条号与锚点词均取自 flk.npc.gov.cn 官方正文（tools/probe.py 实测），
# 不凭记忆填写。

id: consumer.triple_damages
claim: 消费者请求退还价款并主张三倍赔偿

keywords: [买到假货, 假货, 欺诈, 退一赔三, 退货, 消费者, 网购被骗, 虚假宣传, 质量问题, 退款]

limitation:
  years: 3
  fact: limitation
  start_prompt: 三年从哪一天起算？（一般是从你发现被骗、收到货或知道真相那天）
  note: 向商家投诉、申请平台介入、向消协或市场监管投诉，都可能中断时效。

actions:
  - 先把证据固定下来：商品页面截图（含价格和宣传语）、订单、支付记录、聊天记录、商品实物和包装。
  - 不要急着把货退回去——先拍照录像，必要时做检测或鉴定，货退了证据就没了。
  - 先向商家书面提出退一赔三，同时向平台和 12315 投诉，两条线可以并行。

lawyer:
  - when: 时效可能已经过了，请求会被驳回
    fact: limitation
    status: confirmed
  - when: 商家否认欺诈、主张是普通质量瑕疵，需要判断欺诈能否成立
    fact: fraud
    status: confirmed

elements:
  - key: identity
    question: 这个东西是买来自己用、家里用的，还是买来转卖、做生意用的？
    why: 消费者权益保护法只保护"为生活消费需要"的购买者。买来经营转卖的，不适用三倍赔偿，只能按普通合同纠纷处理。
    basis:
      - ref: 消费者权益保护法第2条
        anchor: 为生活消费需要购买、使用商品或者接受服务
    probe:
      - 一次买了多少？数量明显超过自用吗？
      - 你是个人买的，还是以公司名义买的？
    evidence:
      - 订单信息（购买人、数量）
      - 收货地址（家庭住址还是仓库）

  - key: transaction
    question: 在哪买的、什么时候买的、花了多少钱？有没有订单和支付记录？
    why: 三倍赔偿的基数是价款，金额要能对上；主体要明确，才知道该起诉谁。
    basis:
      - ref: 民法典第577条
        anchor: 当事人一方不履行合同义务或者履行合同义务不符合约定的，应当承担继续履行
    probe:
      - 是网店、实体店还是直播间买的？店铺主体是哪家公司？
      - 有没有发票、收据？
    evidence:
      - 订单截图、支付记录
      - 商品页面截图（含价格、宣传语）
      - 发票或收据

  - key: fraud
    question: 商家是怎么骗你的？说了什么、承诺了什么，实际给的是什么？
    why: 三倍赔偿的前提是欺诈——故意告知虚假情况或者隐瞒真实情况。普通质量瑕疵不等于欺诈，这条区分决定能不能要三倍。
    basis:
      - ref: 消费者权益保护法第55条
        anchor: 增加赔偿的金额不足五百元的，为五百元
    probe:
      - 商家有没有说是正品、原装、全新、进口，实际是什么？
      - 有没有检测报告、厂家鉴定、官方渠道核实的结果？
      - 和商家交涉时，对方承认过吗？
    evidence:
      - 商品宣传页面、广告截图
      - 与客服的聊天记录
      - 品牌方或厂家的鉴定意见
      - 检测报告

  - key: return
    question: 货还在你手上吗？有没有退回去？商家同意退吗？
    why: 退货和赔偿是两件事。货退回去而没留证据，往往连退款都难主张；七日内无理由退货有法定条件。
    essential: false
    basis:
      - ref: 消费者权益保护法第25条
        anchor: 消费者有权自收到商品之日起七日内退货
    probe:
      - 收到货多久了？还在七天内吗？
      - 商品是不是定作的、鲜活易腐、拆封的音像制品这类不适用无理由退货的？
    evidence:
      - 商品实物、包装、标签
      - 收货时间凭证（物流记录）
      - 与商家协商退货的记录

  - key: limitation
    question: 从发现被骗到现在，超过三年了吗？中间有没有投诉、索赔过？
    why: 普通诉讼时效三年，从知道或应当知道权利受损起算；投诉和索赔会中断时效。
    essential: false
    basis:
      - ref: 民法典第188条
        anchor: 诉讼时效期间为三年
      - ref: 民法典第195条
        anchor: 诉讼时效中断
    probe:
      - 什么时候发现是假的？怎么发现的？
      - 向 12315 或平台投诉过吗？处理结果是什么？
    evidence:
      - 发现问题的记录及日期
      - 12315 投诉受理单、平台处理记录
