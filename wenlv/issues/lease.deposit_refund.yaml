# 请求权基础：承租人请求返还租赁押金
#
# 条号与锚点词均取自 flk.npc.gov.cn 官方正文（tools/probe.py 实测），
# 不凭记忆填写。

id: lease.deposit_refund
claim: 承租人请求返还租赁押金

keywords: [押金, 退押金, 租房, 房东不退, 租赁, 二房东, 退租, 租金, 房租, 房屋租赁]

limitation:
  years: 3
  fact: limitation
  start_prompt: 三年从哪一天起算？（一般是退租交接完成、押金该退的那天）
  note: 退租后催过押金、房东承诺退、或者双方对账，都会中断时效，从那天重新算三年。

actions:
  - 先把租赁合同、押金收据、转账记录找出来，确认押金金额和退还条件是怎么约定的。
  - 退租时做一次书面交接：拍照记录房屋状况、水电表读数，双方签字或用微信确认。
  - 给房东发一条书面催告，写清押金金额、要求退还的日期和账户，留好记录。

lawyer:
  - when: 时效可能已经过了，对方一旦提时效抗辩，请求会被驳回
    fact: limitation
    status: confirmed
  - when: 房东以房屋损坏为由扣款，双方对损失金额争议大
    fact: deductions
    status: confirmed

elements:
  - key: contract
    question: 房子是跟谁租的？房东本人、中介还是二房东？有没有书面租赁合同？
    why: 要钱得找对人。二房东跑路、中介代收押金的情形，责任主体完全不同；没有书面合同，就要靠聊天和转账证明租赁关系。
    basis:
      - ref: 民法典第703条
        anchor: 租赁合同是出租人将租赁物交付承租人使用、收益
    probe:
      - 合同上签字的是谁？和房产证上的产权人是一个人吗？
      - 租金、押金打给了谁？收款人和合同上的出租人一致吗？
    evidence:
      - 房屋租赁合同
      - 房产证信息或出租人身份信息
      - 中介合同、二房东的转租授权（如有）

  - key: deposit
    question: 押金交了多少？怎么交的？合同里怎么约定退还条件的？
    why: 押金金额和退还条件决定了能要回多少，也决定了房东能不能扣。
    basis:
      - ref: 民法典第703条
        anchor: 租赁合同是出租人将租赁物交付承租人使用、收益
    probe:
      - 押金是转账还是现金？有没有收据？
      - 合同写的是"押一付三"还是别的？押金抵不抵最后一个月租金？
    evidence:
      - 押金收据
      - 转账记录（含对方实名信息）
      - 合同中关于押金的条款

  - key: return
    question: 房子什么时候退的？钥匙交了吗？有没有做交接、拍照？
    why: 押金的退还义务从租赁关系终止、房屋交还时产生。没有交接证据，房东可能主张你还没退房、继续计租。
    basis:
      - ref: 民法典第733条
        anchor: 租赁期限届满，承租人应当返还租赁物
    probe:
      - 退租时有没有签交接单？水电费结清了吗？
      - 有没有微信告诉房东"房子已交还"并且对方回复？
    evidence:
      - 退租交接单
      - 交还钥匙、房屋状况的照片和视频
      - 水电燃气结清凭证
      - 确认退租的聊天记录

  - key: deductions
    question: 房东说不退或者少退，理由是什么？有没有列清单、给票据？
    why: 房东可以就实际损失扣款，但要有依据和凭证；随口扣钱、拿不出票据的，法院一般不支持。
    essential: false
    basis:
      - ref: 民法典第577条
        anchor: 当事人一方不履行合同义务或者履行合同义务不符合约定的，应当承担继续履行
    probe:
      - 房东说哪里坏了？有没有维修报价单、发票？
      - 损坏是正常使用磨损，还是你确实弄坏的？
    evidence:
      - 房东的扣款说明、维修票据
      - 入住时的房屋状况照片（对比用）
      - 双方就扣款的沟通记录

  - key: limitation
    question: 从该退押金那天到现在，超过三年了吗？中间有没有催过？
    why: 押金返还是普通债权，适用三年诉讼时效，超过且无中断事由的，对方可以提出时效抗辩。
    essential: false
    basis:
      - ref: 民法典第188条
        anchor: 诉讼时效期间为三年
      - ref: 民法典第195条
        anchor: 诉讼时效中断
    probe:
      - 最近一次催押金是哪一年哪一月？
      - 房东有没有回过"过几天退""下个月给"这类话？
    evidence:
      - 催要押金的聊天记录及日期
      - 房东承诺退还的记录
