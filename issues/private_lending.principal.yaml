# 请求权基础：出借人请求借款人返还借款本金
#
# basis 里每一项是指向法条的"指针"，不是条文正文：
#   ref    —— 法规名 + 条号
#   anchor —— 该条里的一句话（必须逐字来自官方正文），用来让官方检索稳定命中
#   quote  —— 可选的声称原文；留空时由核验器填入官方原文
#
# 正文一律由核验器从官方源取回，不在本文件里手抄——
# 手抄条文正是这个项目要杜绝的错误来源。

id: private_lending.principal
claim: 出借人请求借款人返还借款本金

elements:
  - key: parties
    question: 出借人和借款人分别是谁？双方都是自然人，还是有一方是公司或个体工商户？
    why: 自然人之间的借款合同是实践合同，自提供借款时才成立；一方是经营主体的，成立规则和举证重点都不同。
    basis:
      - ref: 民法典第667条
        anchor: 借款合同是借款人向贷款人借款

  - key: agreement
    question: 双方有没有明确说过这笔钱是"借"的、要还？
    why: 借款关系以借贷合意为前提。只有转账没有合意，可能被认定为赠与、投资款或不当得利，请求权基础完全不同。
    basis:
      - ref: 民法典第667条
        anchor: 借款合同是借款人向贷款人借款
    probe:
      - 有没有借条、欠条、还款承诺书？
      - 微信、短信里有没有出现"借""还""利息"这类字眼？
      - 转账时有没有写备注用途？

  - key: delivery
    question: 钱实际给出去了吗？给了多少，怎么给的？
    why: 自然人之间的借款合同自贷款人提供借款时成立，没有交付就不成立。
    basis:
      - ref: 民法典第679条
        anchor: 自贷款人提供借款时成立
    probe:
      - 是银行转账还是现金？现金的话有没有取款记录、见证人？
      - 有没有一笔借款拆成几次转？
      - 有没有在给钱的时候先把利息扣掉（砍头息）？

  - key: amount
    question: 本金多少？对方已经还了多少？现在还欠多少？
    why: 请求金额必须能算清，已还部分要扣除；存在砍头息的，本金按实际出借额认定。
    basis:
      - ref: 民法典第670条
        anchor: 利息不得预先在本金中扣除
    probe:
      - 还过的钱是冲本金还是冲利息？有没有约定过冲抵顺序？
      - 有没有对方写的还款记录或者转账截图？

  - key: due
    question: 约定的还款期限到了吗？如果没有约定，你有没有向对方催要过？
    why: 定期借款到期后才能主张返还；不定期借款需要给出合理催告期，催告本身也是证据。
    basis:
      - ref: 民法典第675条
        anchor: 按照约定的期限返还借款
    probe:
      - 借条上写的还款日期是哪天？
      - 催款有没有留下记录（微信、短信、通话录音、律师函）？

  - key: limitation
    question: 从应当还钱那天到今天，超过三年了吗？中间有没有催过款，或者对方承认过欠钱？
    why: 普通诉讼时效为三年，超过且无中断事由的，对方可以提出时效抗辩，直接影响能不能胜诉。
    basis:
      - ref: 民法典第188条
        anchor: 诉讼时效期间为三年
      - ref: 民法典第195条
        anchor: 诉讼时效中断
    probe:
      - 最近一次催款是哪一年哪一月？
      - 对方有没有在任何场合承认过还欠你钱？

  - key: interest
    question: 有没有约定利息？约定的利率是多少、怎么写的？
    why: 未约定利息的，视为不支付利息；约定过高的，超过司法保护上限的部分不受支持。
    basis:
      - ref: 民法典第680条
        anchor: 禁止高利放贷
    probe:
      - 借条上写的是年利率还是月利率，具体数字是多少？
      - 实际收过利息吗？按什么标准收的？
