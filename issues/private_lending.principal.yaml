# 请求权基础：出借人请求借款人返还借款本金
#
# basis 里每一项是指向法条的"指针"，不是条文正文：
#   ref    —— 法规名 + 条号
#   anchor —— 该条里的一句话（必须逐字来自官方正文），用来让官方检索稳定命中
#   quote  —— 可选的声称原文；留空时由核验器填入官方原文
#
# 正文一律由核验器从官方源取回，不在本文件里手抄——
# 手抄条文正是这个项目要杜绝的错误来源。

id: private_lending.principal
claim: 出借人请求借款人返还借款本金

keywords: [借钱, 借款, 欠钱, 欠款, 借条, 不还钱, 还钱, 民间借贷, 借出去, 利息]

limitation:
  years: 3
  fact: limitation
  start_prompt: 三年从哪一天起算？（一般是有约定还款日就从还款日次日算；没约定的，从你催告给的期限届满日算）
  note: 中间催过款、对方承认过欠钱、起诉或申请仲裁的，时效中断重新计算，这种情况要按最后一次中断日重算。

actions:
  - 把借条、转账记录、聊天记录按时间顺序整理成一份清单，标出每笔的日期、金额和方式。
  - 给对方发一条书面催告（微信、短信都行），写清欠多少、要求哪天还——这条记录本身就是时效中断的证据。
  - 金额不大、事实清楚的，可以先申请支付令或走人民调解，比直接起诉快，费用也低。

lawyer:
  - when: 时效可能已经过了，对方一旦提时效抗辩，请求会被驳回
    fact: limitation
    status: confirmed
  - when: 借款还没到期，现在起诉会被驳回，但可能要提前主张
    fact: due
    status: denied
  - when: 约定利率偏高，超过司法保护上限的部分不受支持
    fact: interest
    status: confirmed

elements:
  - key: parties
    question: 出借人和借款人分别是谁？双方都是自然人，还是有一方是公司或个体工商户？
    why: 自然人之间的借款合同是实践合同，自提供借款时才成立；一方是经营主体的，成立规则和举证重点都不同。
    essential: false
    basis:
      - ref: 民法典第667条
        anchor: 借款合同是借款人向贷款人借款
    evidence:
      - 双方的身份证复印件或身份信息
      - 借条上签字人的姓名、身份证号

  - key: agreement
    question: 双方有没有明确说过这笔钱是"借"的、要还？
    why: 借款关系以借贷合意为前提。只有转账没有合意，可能被认定为赠与、投资款或不当得利，请求权基础完全不同。
    basis:
      - ref: 民法典第667条
        anchor: 借款合同是借款人向贷款人借款
    probe:
      - 有没有借条、欠条、还款承诺书？
      - 微信、短信里有没有出现"借""还""利息"这类字眼？
      - 转账时有没有写备注用途？
    evidence:
      - 借条、欠条或还款承诺书原件
      - 微信/短信聊天记录（导出备份，别只留截图）
      - 转账时的备注截图
      - 通话录音（如有）

  - key: delivery
    question: 钱实际给出去了吗？给了多少，怎么给的？
    why: 自然人之间的借款合同自贷款人提供借款时成立，没有交付就不成立。
    basis:
      - ref: 民法典第679条
        anchor: 自贷款人提供借款时成立
    probe:
      - 是银行转账还是现金？现金的话有没有取款记录、见证人？
      - 有没有一笔借款拆成几次转？
      - 有没有在给钱的时候先把利息扣掉（砍头息）？
    evidence:
      - 银行转账流水（柜台打印并盖章，比手机截图有力）
      - 微信/支付宝转账记录（含对方实名信息）
      - 现金交付的取款凭证、见证人联系方式

  - key: amount
    question: 本金多少？对方已经还了多少？现在还欠多少？
    why: 请求金额必须能算清，已还部分要扣除；存在砍头息的，本金按实际出借额认定。
    basis:
      - ref: 民法典第670条
        anchor: 利息不得预先在本金中扣除
    probe:
      - 还过的钱是冲本金还是冲利息？有没有约定过冲抵顺序？
      - 有没有对方写的还款记录或者转账截图？
    evidence:
      - 借条上记载的金额
      - 对方历次还款的转账记录
      - 双方对过账的聊天记录或对账单

  - key: due
    question: 约定的还款期限到了吗？如果没有约定，你有没有向对方催要过？
    why: 定期借款到期后才能主张返还；不定期借款需要给出合理催告期，催告本身也是证据。
    essential: false
    basis:
      - ref: 民法典第675条
        anchor: 按照约定的期限返还借款
    probe:
      - 借条上写的还款日期是哪天？
      - 催款有没有留下记录（微信、短信、通话录音、律师函）？
    evidence:
      - 借条上的还款日期
      - 催款记录（微信、短信、通话录音、律师函）

  - key: limitation
    question: 从应当还钱那天到今天，超过三年了吗？中间有没有催过款，或者对方承认过欠钱？
    why: 普通诉讼时效为三年，超过且无中断事由的，对方可以提出时效抗辩，直接影响能不能胜诉。
    essential: false
    basis:
      - ref: 民法典第188条
        anchor: 诉讼时效期间为三年
      - ref: 民法典第195条
        anchor: 诉讼时效中断
    probe:
      - 最近一次催款是哪一年哪一月？
      - 对方有没有在任何场合承认过还欠你钱？
    evidence:
      - 每一次催款的记录及日期
      - 对方承认欠款的聊天、录音或书面材料
      - 之前起诉或申请仲裁的材料

  - key: interest
    question: 有没有约定利息？约定的利率是多少、怎么写的？
    why: 未约定利息的，视为不支付利息；约定过高的，超过司法保护上限的部分不受支持。
    essential: false
    basis:
      - ref: 民法典第680条
        anchor: 禁止高利放贷
    probe:
      - 借条上写的是年利率还是月利率，具体数字是多少？
      - 实际收过利息吗？按什么标准收的？
    evidence:
      - 借条上关于利率的约定
      - 历次收息的转账记录
