# 请求权基础：离婚时请求分割夫妻共同财产
#
# 条号与锚点词均取自 flk.npc.gov.cn 官方正文（tools/probe.py 实测），
# 不凭记忆填写。

id: marriage.property_division
claim: 离婚时请求分割夫妻共同财产

keywords: [离婚, 财产分割, 夫妻共同财产, 婚后财产, 分房子, 分割财产, 婚内, 老公, 老婆, 离婚分财产]

limitation:
  years: 3
  fact: limitation
  start_prompt: 三年从哪一天起算？（离婚时一并分割的没有这个问题；如果是离婚后才发现对方隐匿财产，从发现那天算）
  note: 离婚时一并分割不适用诉讼时效；离婚后发现对方隐藏、转移财产的，从发现之日起三年内可以再起诉。

actions:
  - 先把财产清单列出来：房产、存款、车辆、股票、公积金、公司股权、对外债权，每项写清登记在谁名下。
  - 收集对方转移财产的线索（大额转账、房产过户记录），发现后尽快申请财产保全，晚了钱就追不回来。
  - 孩子抚养安排先想清楚，它直接影响房子判给谁、怎么折价补偿。

lawyer:
  - when: 发现对方转移、隐匿财产，需要尽快申请财产保全
    fact: concealment
    status: confirmed
  - when: 涉及公司股权、代持、境外资产，价值认定复杂
    fact: scope
    status: confirmed

elements:
  - key: marriage
    question: 你们什么时候登记结婚的？中间有没有分居，之前起诉过离婚吗？
    why: 夫妻共同财产以婚姻关系存续期间为界，结婚登记日期决定了哪些财产算共同财产。
    basis:
      - ref: 民法典第1062条
        anchor: 夫妻在婚姻关系存续期间所得的下列财产
    probe:
      - 有没有领结婚证？有没有办过婚礼但没领证？
      - 第一次起诉离婚是什么时候？法院判离了没有？
    evidence:
      - 结婚证
      - 分居的证明（租房合同、居住证明）
      - 之前的离婚起诉材料、判决书

  - key: scope
    question: 现在有哪些财产？房子、存款、车、股票、公积金、公司股权、别人欠你们的钱，各自登记在谁名下？
    why: 分割的前提是先把财产清点出来。漏掉的财产法院不会主动分，事后再主张要另案起诉。
    basis:
      - ref: 民法典第1062条
        anchor: 夫妻在婚姻关系存续期间所得的下列财产
    probe:
      - 房子是婚后买的还是婚前买的？首付谁出的？贷款谁在还？
      - 存款在谁名下？你知道大概有多少吗？
      - 有没有以父母或亲戚名义持有的财产？
    evidence:
      - 房产证、购房合同、贷款合同
      - 银行账户流水、存款证明
      - 车辆登记证、行驶证
      - 股票、基金账户对账单
      - 公积金缴存明细
      - 公司工商登记信息、股权证明

  - key: separate
    question: 有没有婚前就有的财产、因受伤拿到的赔偿款、或者遗嘱和赠与合同里写明只给一方的财产？
    why: 个人财产不参与分割。但婚前财产一旦和婚后收入混同（比如卖房款转进共同账户），举证难度会大幅上升。
    essential: false
    basis:
      - ref: 民法典第1063条
        anchor: 下列财产为夫妻一方的个人财产
    probe:
      - 婚前做过财产公证吗？
      - 父母出钱买房时，有没有书面写明只赠与你一个人？
    evidence:
      - 婚前财产的取得凭证及日期
      - 财产公证文书
      - 父母出资的转账记录及书面说明

  - key: agreement
    question: 你们签过婚前协议或者婚内财产约定吗？比如AA制、各管各的钱。
    why: 有合法有效的书面财产约定，优先按约定处理，不再适用法定的共同财产制。
    essential: false
    basis:
      - ref: 民法典第1065条
        anchor: 男女双方可以约定婚姻关系存续期间所得的财产
    probe:
      - 约定是书面的还是口头说的？有没有双方签字？
      - 约定的内容具体是什么？各自所有，还是部分共同？
    evidence:
      - 婚前协议、婚内财产约定书
      - 约定签署时的见证或公证材料

  - key: debt
    question: 家里有没有对外欠款？借的钱用在什么地方，另一方知情或者签字了吗？
    why: 夫妻共同债务要用共同财产清偿，直接减少可分割的净值；个人债务不能拿对方那份去还。
    essential: false
    basis:
      - ref: 民法典第1064条
        anchor: 夫妻双方共同签名或者夫妻一方事后追认等共同意思表示所负的债务
    probe:
      - 借钱时另一方有没有一起签字或者事后认过？
      - 借的钱是用于家庭生活、看病、孩子上学，还是个人经营、赌博？
    evidence:
      - 借条、借款合同上的签字
      - 借款用途的证明（转账记录、消费记录）
      - 债权人催收的材料

  - key: concealment
    question: 对方有没有转移、藏匿、变卖财产？比如突然大额取现、把房子过户给亲属、低价卖车？
    why: 有这类行为可以请求对方少分或者不分，但要有证据；发现得早还可以申请财产保全，晚了钱就追不回来了。
    essential: false
    basis:
      - ref: 民法典第1092条
        anchor: 夫妻一方隐藏、转移、变卖、毁损、挥霍夫妻共同财产
    probe:
      - 近一年有没有发现异常的大额转账、取现？
      - 有没有查过房产、车辆、股权的登记变动？
    evidence:
      - 银行流水中的大额异常转账
      - 房产、车辆的过户记录
      - 亲属账户收款记录
      - 相关聊天记录或录音

  - key: children
    question: 有没有未成年子女？现在跟谁生活？抚养权打算怎么安排？
    why: 分割时要照顾子女、女方和无过错方权益，抚养安排直接影响房子判给谁、怎么补偿。
    essential: false
    basis:
      - ref: 民法典第1087条
        anchor: 由双方协议处理；协议不成的，由人民法院根据财产的具体情况
    probe:
      - 孩子多大？一直是谁在带？
      - 房子判给带孩子一方的话，另一方能不能拿出补偿款？
    evidence:
      - 子女出生证明
      - 孩子日常由谁照顾的证明（接送记录、学费缴纳）
      - 双方的收入证明（用于计算抚养费和补偿）
