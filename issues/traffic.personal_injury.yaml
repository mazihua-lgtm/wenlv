# 请求权基础：交通事故受害人请求赔偿人身损害损失
#
# 条号与锚点词均取自 flk.npc.gov.cn 官方正文（tools/probe.py 实测），
# 不凭记忆填写。

id: traffic.personal_injury
claim: 交通事故受害人请求赔偿人身损害损失

elements:
  - key: accident
    question: 事故是什么时候、在哪里发生的？谁开的车，车是谁的？当时报警了吗？
    why: 责任划分和赔偿主体都从这里来。没有交警的事故认定书，举证难度完全不同，还可能被对方倒打一耙。
    basis:
      - ref: 民法典第1208条
        anchor: 机动车发生交通事故造成损害的，依照道路交通安全法律和本法的有关规定承担赔偿责任
    probe:
      - 有没有拿到事故认定书？认定书上怎么写的？
      - 对方是车主本人开的，还是借的、租的、雇的司机？

  - key: liability
    question: 事故认定书怎么划分责任的？对方是全责、主要责任，还是同等责任？
    why: 赔偿责任按责任比例分担，这一条直接决定最后能拿到多少。
    basis:
      - ref: 民法典第1208条
        anchor: 机动车发生交通事故造成损害的，依照道路交通安全法律和本法的有关规定承担赔偿责任
      - ref: 民法典第1165条
        anchor: 行为人因过错侵害他人民事权益造成损害的，应当承担侵权责任
    probe:
      - 对认定结果服不服？有没有在三日内申请复核？
      - 对方有没有酒驾、无证、闯红灯、逃逸这些情形？

  - key: insurance
    question: 对方车辆买了交强险吗？有没有商业三者险，保额多少？保险公司有没有人来过？
    why: 赔偿有顺序：先交强险，不足部分商业险按合同赔，最后才由肇事者自己承担。顺序搞错，可能白跑一趟。
    basis:
      - ref: 民法典第1213条
        anchor: 先由承保机动车强制保险的保险人在强制保险责任限额范围内予以赔偿
    probe:
      - 保单信息拿到了吗？承保公司是哪家？
      - 保险公司有没有先行垫付过抢救费用？

  - key: injury
    question: 伤在哪里？住院多久？做过伤残鉴定吗，几级？
    why: 赔偿项目按伤情和伤残等级计算，伤残赔偿金往往是大头；没做鉴定的，这部分会漏掉。
    basis:
      - ref: 民法典第1179条
        anchor: 医疗费、护理费、交通费、营养费、住院伙食补助费
    probe:
      - 有没有病历、诊断证明、出院小结、医疗费票据？
      - 是在上班路上或者工作中出的事故吗？那可能同时构成工伤，走两条路径。

  - key: losses
    question: 医疗费花了多少？误工多久、出事前每月收入多少？有没有请人护理、有没有交通和营养支出？
    why: 每一项都要有票据和证明支撑，算不清、拿不出凭证的部分，法院不会支持。
    basis:
      - ref: 民法典第1179条
        anchor: 医疗费、护理费、交通费、营养费、住院伙食补助费
    probe:
      - 工资是打卡还是发现金？有没有工资流水、个税记录？
      - 护理是家人照顾还是请的护工？有没有票据？

  - key: limitation
    question: 从事故发生或者治疗结束到现在，超过三年了吗？中间有没有向对方或者保险公司主张过？
    why: 人身损害赔偿适用三年诉讼时效，从知道或者应当知道权利受损起算，超过且无中断事由的会被驳回。
    basis:
      - ref: 民法典第188条
        anchor: 诉讼时效期间为三年
      - ref: 民法典第195条
        anchor: 诉讼时效中断
    probe:
      - 最近一次和对方或保险公司谈赔偿是哪一年哪一月？
      - 有没有书面的理赔申请、调解记录、微信催告？
