# 请求权基础：出卖人请求买受人支付价款
#
# 条号与锚点词均取自 flk.npc.gov.cn 官方正文（tools/probe.py 实测），
# 不凭记忆填写。

id: sale.buyer_payment
claim: 出卖人请求买受人支付价款

keywords: [货款, 买卖合同, 拖欠货款, 发货, 供货, 采购, 合同款, 不给钱, 结算, 欠我货款]

limitation:
  years: 3
  fact: limitation
  start_prompt: 三年从哪一天起算？（约定的付款日次日；没约定的，从交货或催告期满次日起算）
  note: 对账、催款、对方承诺付款都会中断时效，从中断那天重新算三年。

actions:
  - 先和对方对一次账，把总额、已付、未付写成一份对账单发过去，让对方确认——微信回一句"对"也算。
  - 催款走能留痕的渠道（微信、邮件、书面催款函），每催一次记下日期。
  - 对方有转移财产、注销公司迹象的，起诉时一并申请财产保全，否则赢了也拿不到钱。

lawyer:
  - when: 时效可能已经过了，对方一旦提时效抗辩，请求会被驳回
    fact: limitation
    status: confirmed
  - when: 付款期还没到，现在起诉会被驳回
    fact: overdue
    status: denied
  - when: 对方以质量不符为由拒付，需要判断抗辩能否成立
    fact: quality
    status: confirmed

elements:
  - key: contract
    question: 这笔买卖是怎么谈成的？有没有合同、订单、报价单、微信记录，双方是谁？
    why: 买卖合同不以书面为要件，但主体、标的、价款要能对上，否则连"谁向谁要钱"都说不清。
    basis:
      - ref: 民法典第595条
        anchor: 买卖合同是出卖人转移标的物的所有权于买受人
    probe:
      - 合同或订单上盖的是哪家公司的章？签字人是谁？
      - 微信、邮件里有没有确认过货品、单价、总价？
    evidence:
      - 买卖合同、采购订单、报价单
      - 微信或邮件里确认货品、单价的记录
      - 对方的营业执照信息或身份信息

  - key: delivery
    question: 货交了吗？什么时候、怎么交的，对方有没有签收？
    why: 买受人付款义务以出卖人交付为对应；交付证据缺失，对方常以"没收到货"抗辩。
    basis:
      - ref: 民法典第598条
        anchor: 出卖人应当履行向买受人交付标的物
    probe:
      - 有没有送货单、物流单、签收记录？签收人是谁？
      - 对方有没有在微信里确认收到货？
    evidence:
      - 送货单、签收单（有对方签字或盖章）
      - 物流单号及物流轨迹
      - 对方确认收货的聊天记录

  - key: price
    question: 总价多少？已经付了多少？现在还欠多少？付款期限是怎么约定的？
    why: 请求金额和付款期限要能算清；没有约定付款时间的，付款义务成立时点不同，直接影响能不能现在就主张。
    basis:
      - ref: 民法典第626条
        anchor: 买受人应当按照约定的数额和支付方式支付价款
      - ref: 民法典第628条
        anchor: 买受人应当按照约定的时间支付价款
    probe:
      - 有没有对账单、结算单？对方确认过欠款金额吗？
      - 约定的是货到付款、月结30天，还是分批付？
    evidence:
      - 对账单、结算单
      - 已付款的银行流水
      - 合同里关于付款期限的条款

  - key: overdue
    question: 付款期限过了吗？你有没有催过款？
    why: 逾期才产生迟延责任；催告记录既证明违约，也是主张利息损失的起点。
    essential: false
    basis:
      - ref: 民法典第626条
        anchor: 买受人应当按照约定的数额和支付方式支付价款
    probe:
      - 催款是微信、电话还是发过律师函？有没有留痕？
      - 对方有没有回过"再宽限几天""下个月付"这类话？
    evidence:
      - 催款记录及日期
      - 对方承诺付款的聊天记录

  - key: quality
    question: 对方有没有提过质量问题、要求退货或者少付？提的时间离收货多久？
    why: 买受人在检验期限内不提异议的，视为数量和质量符合约定；这条是对方最常用的抗辩，要提前判断能不能站住。
    essential: false
    basis:
      - ref: 民法典第621条
        anchor: 买受人怠于通知的，视为标的物的数量或者质量符合约定
      - ref: 民法典第620条
        anchor: 买受人收到标的物时应当在约定的检验期限内检验。没有约定检验期限的，应当及时检验
    probe:
      - 对方提质量问题时，有没有书面通知、照片、检测报告？
      - 收货后多久才提的？合同约定的检验期是几天？
    evidence:
      - 对方提出的质量异议材料及时间
      - 合同约定的检验期限
      - 产品的合格证明、质检报告

  - key: limitation
    question: 从该付钱那天到今天，超过三年了吗？中间有没有催款、对账，或者对方承认过欠款？
    why: 普通诉讼时效为三年，超过且无中断事由的，对方可以提出时效抗辩，直接决定能不能胜诉。
    essential: false
    basis:
      - ref: 民法典第188条
        anchor: 诉讼时效期间为三年
      - ref: 民法典第195条
        anchor: 诉讼时效中断
    probe:
      - 最近一次催款或对账是哪一年哪一月？
      - 对方有没有在任何书面材料里承认过欠款？
    evidence:
      - 每一次催款、对账的记录及日期
      - 对方承认欠款的书面材料
